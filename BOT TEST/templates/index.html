<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartServe Lite Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">SmartServe Lite – Self-Service Portal</h2>

        <!-- Check Order Status -->
        <div class="card mb-3">
            <div class="card-header bg-primary text-white">Check Order Status</div>
            <div class="card-body">
                <input type="text" id="orderId" class="form-control mb-2" placeholder="Enter Order ID">
                <button class="btn btn-success" onclick="checkOrder()">Check Status</button>
                <p id="orderResult" class="mt-3 text-primary"></p>
            </div>
        </div>

        <!-- Next Best Action -->
        <div class="card mb-3">
            <div class="card-header bg-info text-white">Get Next Best Action</div>
            <div class="card-body">
                <select id="issueType" class="form-control mb-2">
                    <option value="invoice">Invoice Issue</option>
                    <option value="delivery">Delivery Problem</option>
                    <option value="support">Need Support</option>
                </select>
                <button class="btn btn-warning" onclick="predictAction()">Get Recommendation</button>
                <p id="actionResult" class="mt-3 text-info"></p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
